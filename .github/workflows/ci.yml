name: PeopleOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: peopleos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: peopleos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d peopleos_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci-only-database-password@127.0.0.1:5432/peopleos_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:ci-only-database-password@127.0.0.1:5432/peopleos_test?schema=public
      JWT_SECRET: ci-only-ephemeral-jwt-secret-at-least-32-characters
      AI_SERVICE_TOKEN: ci-only-ephemeral-ai-token-at-least-32-characters
      CLIENT_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run install:apps
      - run: npm --prefix Server run db:migrate
      - run: npm run check
      - run: npm run test:api
      - run: npm audit --prefix Server --omit=dev && npm audit --prefix Client --omit=dev
      - run: npx --prefix Client playwright install --with-deps chromium
      - name: Start production builds and run browser workflows
        shell: bash
        run: |
          (cd Server && node dist/main.js) > api.log 2>&1 &
          (cd Client && npm start) > web.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-and-service-diagnostics
          path: |
            Client/playwright-report/
            Client/test-results/
            api.log
            web.log
  ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests scripts
      - run: python -m pytest -q
      - run: python scripts/audit.py
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEMO_PASSWORD: ci-only-demo-password-2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/init-env.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose --profile demo run --rm seed
      - run: docker compose --profile demo run --rm seed
      - run: npm run smoke:containers
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
