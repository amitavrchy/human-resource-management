name: peopleos
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peopleos
      POSTGRES_DB: ${POSTGRES_DB:-peopleos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/init-env.mjs first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U peopleos -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: ./Server
      target: migration
    environment:
      DATABASE_URL: postgresql://peopleos:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peopleos}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: ./Server
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://peopleos:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peopleos}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Run node scripts/init-env.mjs first}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Run node scripts/init-env.mjs first}
      AI_SERVICE_URL: http://ai:8001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: 1
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploaded_files:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ['4000']
    security_opt: ['no-new-privileges:true']
  ai:
    build: ./ai
    restart: unless-stopped
    init: true
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Run node scripts/init-env.mjs first}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CHROMA_PATH: /app/data/chroma
    volumes:
      - handbook_vectors:/app/data
    expose: ['8001']
    security_opt: ['no-new-privileges:true']
  web:
    build:
      context: ./Client
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    init: true
    ports: ['${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000']
    depends_on:
      api:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
  seed:
    profiles: [demo]
    build:
      context: ./Server
      target: migration
    command: [node, prisma/seed.mjs]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://peopleos:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peopleos}?schema=public
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploaded_files:/app/uploads
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  uploaded_files:
  handbook_vectors:
